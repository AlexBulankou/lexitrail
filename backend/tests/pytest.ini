# pytest.ini
[pytest]
log_cli = true
log_level = INFO

# lexitrail#269: anyio (a transitive dep of google-genai/httpx) registers a
# pytest11 entry point whose plugin imports `_pytest.scope`, a module pytest
# added in 7.2 -- this repo pins pytest==6.2.5, so plugin auto-load crashes
# pytest before it collects a single test. No test here uses anyio/async, so
# disabling the plugin costs nothing. Verified: without this, `pytest tests/`
# fails at startup with `ModuleNotFoundError: No module named '_pytest.scope'`.
addopts = -p no:anyio
