# cloudbuild.yaml — lexitrail's FIRST CI/deploy build config (issue-77).
#
# WHY THIS EXISTS: no Cloud Build trigger has ever existed on the `lexitrail`
# project, and no backend image has ever been built — all 6 builds in the
# project's history are manual `gcloud builds submit` of the UI. The live
# backend ReplicaSet has been running the same 2026-07-22 digest for weeks, so
# every merged backend fix (#103, #114, #115, #38, #48) is absent from prod.
# That is worse than a delay: a merged-but-unbuilt fix is indistinguishable
# from a fix that does not work, and it manufactures re-diagnosis of correct
# work on every backend merge.
#
# AUTHORIZED by Alex 2026-08-13 via zz1, verbatim: "yes authorized but make
# sure Cloud Builds are wired into $5 per day rule with enforcements, this
# should should not change it." The fleet is running ~$8-9/day against a $5.00
# target, so this is being added to a budget ALREADY OVER. Every cost decision
# below is a constraint from that authorization, not a preference:
#
#   1. main-only deploy trigger, no per-PR image build   (trigger-side)
#   2. includedFiles path filters                        (trigger-side)
#   3. layer caching — see `pull-cache` + `--cache-from` (here)
#   4. DEFAULT machineType — deliberately NOT specified  (here, by omission)
#   5. visible to the same daily budget enforcement      (here, step 0)
#
# 🔴 SCOPE: this BUILDS AND PUSHES the backend image. It does not roll the
# deployment, and — corrected 2026-08-28 — a push does NOT reach prod on its
# own. The live Deployment is pinned BY DIGEST, not by tag:
#
#     lexitrail-backend  .../lexitrail-backend@sha256:<digest>   imagePullPolicy: Always
#
# `imagePullPolicy: Always` is INERT against a digest — there is nothing newer
# for the same digest to resolve to — so `rollout restart` re-pulls the same
# bytes and ships nothing. The rollout step is:
#
#     kubectl -n lexitrail set image deployment/lexitrail-backend \
#       lexitrail-backend=${_IMAGE}@sha256:<the new digest>
#     kubectl -n lexitrail get deploy lexitrail-backend \
#       -o jsonpath='{.spec.template.spec.containers[0].image}'   # READ IT BACK
#     python3 scripts/smoke_served_content.py   # ...AND READ THE SERVED BYTES (#235 AC1)
#
# 🔴 THE LAST LINE IS NOT OPTIONAL, AND THE TWO CHECKS ANSWER DIFFERENT QUESTIONS.
# The digest read-back proves the DEPLOYMENT moved. It has no opinion on what the
# site SERVES. Every path on lexitrail returns 200 — including ones that do not
# exist — so the obvious check certifies nothing (issue-77). The smoke compares the
# served og:image against what `ui/public/index.html` declares and asserts the asset
# comes back as an image rather than the SPA shell.
#
#     exit 0  PASS         served content matches source
#     exit 1  FAIL         stale or wrong content -- a real finding
#     exit 3  CANNOT-TELL  the discriminator died, or the site did not answer
#
# ⚠️ Exit 3 is NOT a failure and must not be wired as one. It means the probe could
# not look. Treating it as a bad deploy trains people to ignore it, which converts
# the third state back into noise and then into nothing.
#
# ⚠️ `rollout status` reports that pods rolled. It has no opinion on whether the
# IMAGE changed, so it returns success for a no-op restart. That criticism is
# correct and worth keeping.
#
# 🔴 BUT DO NOT ANSWER IT BY COMPARING DIGESTS, which is what this comment used
# to say (issue-230). TWO BUILDS OF IDENTICAL SOURCE PRODUCE DIFFERENT DIGESTS,
# so digest inequality does not imply a content difference. Measured 2026-08-28:
# the live image (sha256:05a9f7bf…, a manual `gcloud builds submit`) and a fresh
# trigger build (sha256:ab3a6696…) differed with NO backend/ commits between
# them. Following the old advice says "stale — deploy again" for a deployment
# that is fully current.
#
# ⚠️ And it fails toward ACTING. A check that wrongly says "up to date" is caught
# the next time someone looks for their fix; a check that wrongly says "stale"
# produces an unnecessary production rollout, and the rollout SUCCEEDS — so
# nothing contradicts it afterwards. It also carried the credibility of being the
# considered replacement for a known-bad check, which is exactly why nobody
# re-derived it.
#
# COMPARE SOURCE, NOT DIGESTS. `:$SHORT_SHA` exists for this — it is what maps a
# running pod back to a commit:
#
#     LIVE=$(kubectl -n lexitrail get deploy lexitrail-backend \
#       -o jsonpath='{.spec.template.spec.containers[0].image}')
#     # resolve that digest to its :<sha> tag
#     gcloud artifacts docker images list ${_IMAGE} --include-tags \
#       --filter="version=${LIVE##*@}" --format='value(tags)'
#     git merge-base --is-ancestor <that-sha> origin/main   # live commit is on main
#     git log --oneline <that-sha>..origin/main -- backend/ # EMPTY => nothing to deploy
#
# The last line is the real question — *is there a backend change not yet live* —
# and it needs no digest comparison at all.
#
# ⚠️ Run it with a CONTROL, because an empty result is the answer you want and an
# empty result is also what a broken invocation returns. Re-run the same `git log`
# against an OLDER backend commit; if that is empty too, the command is not
# discriminating and the "nothing to deploy" reading is worthless. Verified
# 2026-08-29: live `4a939ef` -> empty, prior backend commit -> one commit.
#
# ⏳ The recipe needs the live image to carry a `:<sha>` tag, which a manual
# `gcloud builds submit` does not produce. That was NOT true when issue-230 was
# filed (the then-live image was hand-submitted and untagged) and IS true now —
# the 2026-08-29 rollout of #233 put a trigger-built image live. If a hand
# submit ever goes out again, this recipe stops applying until the next trigger
# build, and the honest answer in that window is "cannot tell from the tag",
# never a digest comparison.
#
# 🔴 THIS PARAGRAPH USED TO SAY THE OPPOSITE, and it nearly cost a live security
# fix. It read: "The live spec is `:latest` with `imagePullPolicy: Always` …
# Pods cycle daily and re-pull `:latest`, so a push reaches prod within a day on
# its own." Following it during the 2026-08-28 deploy of issue-182 (a member-email
# exposure) would have produced a green build, a successful `rollout restart`, and
# `GET /users` still answering — the fix reported shipped and not shipped. The
# cluster spec was checked directly, which is the only reason it was caught.
# Corrected in place rather than appended: both readings survive an append and
# the stale one is the reassuring one.
#
# The cluster is in ANOTHER project (ys-autopilot / yojowa-claw / ns lexitrail),
# so the rollout needs cross-project credentials and remains a separate change.

substitutions:
  # Default empty so ordinary builds are unaffected; only a deliberate re-run
  # with --substitutions=_BREAK_GLASS=1 overrides the quota gate. The override
  # is still COUNTED — an override nobody counts becomes the habit.
  _BREAK_GLASS: ''
  _IMAGE: 'us-central1-docker.pkg.dev/lexitrail/lexitrail-repo/lexitrail-backend'

steps:

  # ─── goal 1.1 — BUILD-COUNT QUOTA, ENFORCING ────────────────────────────────
  # 🔴 THIS STEP MUST BE ABLE TO REFUSE, AND THREE THINGS ARE LOAD-BEARING.
  # Each of them fails toward "the gate is present and enforces nothing", which
  # is the worst outcome here because it reads as compliance with constraint 5
  # while creating an uncapped spending path.
  #
  # (a) `--trigger-name=$TRIGGER_NAME` (issue-8237). A Cloud Build step gets no
  #     ambient environment, so without the flag the trigger name reads EMPTY,
  #     empty is treated as ungated, and `inbuild.py`'s per-trigger downgrade
  #     turns enforcement off while leaving counting on. Silent.
  #
  # (b) The `env:` block below. The refusal message tells a blocked engineer to
  #     re-run with `_BREAK_GLASS=1`; without this wiring that variable never
  #     reaches the process and the hatch the message names does not exist. A
  #     documented, unreachable escape hatch is worse than none — it is
  #     specific, reads as actionable, and burns the one person already having
  #     a bad build.
  #
  # (c) Every other step says `waitFor: ['quota-gate']`. In Cloud Build,
  #     `waitFor: ['-']` means START AT t=0 REGARDLESS OF FILE POSITION, so a
  #     gate at the top of a file whose steps all say `['-']` gates ZERO of
  #     them. Note this is NOT "delete the dashes": a step with no `waitFor`
  #     waits for the one above it, which serialises everything. Point them AT
  #     the gate.
  #
  # ⚠️ ALSO REQUIRED, and NOT in this file: `lexitrail`'s `gate_triggers` in
  # config/build-budget.json is `[]`, and an empty list means NOTHING CAN EVER
  # BE REFUSED (`gate.py` names lexitrail as the live instance of exactly this:
  # "enforcing=TRUE but `gate_triggers` is EMPTY — nothing can ever be refused
  # here"). The trigger's name must be added to that list in the same change
  # that creates the trigger, or this step counts and never blocks.
  - name: 'python:3.11-slim'
    id: 'quota-gate'
    entrypoint: 'python3'
    args:
      - 'scripts/build_budget/inbuild.py'
      - '--repo=lexitrail'
      - '--state-uri=gs://lexitrail-build-budget/count-lexitrail.json'
      - '--build-id=$BUILD_ID'
      - '--trigger-name=$TRIGGER_NAME'
    env:
      - 'ENSEMBLE_BUILD_QUOTA_BREAK_GLASS=${_BREAK_GLASS}'
    waitFor: ['-']

  # ─── layer cache: pull the previous image, tolerate its absence ─────────────
  # `|| true` because the FIRST build has nothing to pull — and a missing cache
  # must not be a build failure. An uncached image rebuild is the single most
  # expensive thing this file can do, which is why the pull is worth a step.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args: ['-c', 'docker pull ${_IMAGE}:latest || true']
    waitFor: ['quota-gate']

  # ─── build ─────────────────────────────────────────────────────────────────
  # No `machineType` anywhere in this file, deliberately (constraint 4): the
  # default is the cheap one, and specifying a larger one is a silent cost
  # increase that no reviewer of a later PR would think to look for.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-build'
    args:
      - 'build'
      - '--cache-from'
      - '${_IMAGE}:latest'
      - '-t'
      - '${_IMAGE}:latest'
      - '-t'
      - '${_IMAGE}:$SHORT_SHA'
      - './backend'
    waitFor: ['pull-cache']

# Both tags are pushed. `:latest` is NOT what the live Deployment pulls — it is
# pinned by digest (see SCOPE above), so `:latest` serves the `--cache-from`
# pull and gives a human a tag to reason about, nothing more. `:$SHORT_SHA`
# exists so a running pod can be traced back to a commit — the absence of that
# is why "is this fix deployed?" has needed ReplicaSet archaeology rather than
# a lookup.
# The implicit `images:` block is GONE, and its absence is the change. It pushed
# both tags but told us nothing: it reports no digest, and the live Deployment is
# pinned BY digest -- so there was never a value to deploy. That is the whole
# reason this file built and shipped nothing.
#
# Pushing explicitly instead, and capturing the digest, is exactly what
# cloudbuild-ui.yaml already does. This mirrors it deliberately rather than
# inventing a second shape: the UI path is the one with a live green run behind it.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'backend-push'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push '${_IMAGE}:latest'
        docker push '${_IMAGE}:$SHORT_SHA' | tee /workspace/push.log
        DIGEST="$$(grep -oE 'sha256:[a-f0-9]{64}' /workspace/push.log | tail -1)"
        # CANNOT-TELL must not proceed as success: an empty digest would make
        # `set image` a no-op arg and the read-back compare '' against '', passing.
        [ -n "$$DIGEST" ] || { echo "PUSH-FAIL: no digest in push output -- refusing to deploy an unknown image" >&2; exit 1; }
        printf '%s@%s' '${_IMAGE}' "$$DIGEST" > /workspace/backend_image_ref.txt
        echo "pushed: $$(cat /workspace/backend_image_ref.txt)"
    waitFor: ['backend-build']

  # `set image` to the digest, then READ THE LIVE SPEC BACK and compare.
  #
  # Not `rollout status`, which this file's own comments already warned about at
  # length: it reports that pods rolled and has no opinion on whether the image
  # changed, so it returns success for a no-op restart -- the exact shape that let
  # backend merges look deployed while shipping nothing. It runs here for its
  # waiting behaviour; the COMPARE is what decides.
  #
  # The cross-project credential this needs already exists: `lexitrail-sa` was
  # granted `roles/container.developer` on `yojowa-claw` for the UI path
  # (issue-216, 2026-08-29), and BOTH triggers run as that same account -- verified,
  # not assumed. So the access has been in place since 08-29 and the backend simply
  # never had the step. If `set image` ever returns PERMISSION_DENIED the build goes
  # red at the last step, loudly, which is the correct direction: do not "fix" that
  # by deleting this step, which restores build-and-ship-nothing.
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'backend-deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud container clusters get-credentials ys-autopilot \
          --region us-central1 --project yojowa-claw
        REF="$$(cat /workspace/backend_image_ref.txt)"
        kubectl -n lexitrail set image deployment/lexitrail-backend \
          lexitrail-backend="$$REF"
        kubectl -n lexitrail rollout status deployment/lexitrail-backend --timeout=300s
        LIVE="$$(kubectl -n lexitrail get deploy lexitrail-backend \
          -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "requested: $$REF"
        echo "live spec: $$LIVE"
        [ "$$LIVE" = "$$REF" ] || { echo "DEPLOY-FAIL: live spec does not match what we pushed" >&2; exit 1; }
    waitFor: ['backend-push']

  # ─── post-deploy CONTENT smoke (issue-77 AC3) ───────────────────────────────
  # The header of this file has said since #235 that reading the served bytes is
  # "NOT OPTIONAL" — and until now no step did it. This is that step.
  #
  # 🔴 It runs `smoke_backend_content.py`, NOT `smoke_served_content.py`, and the
  # distinction is the point. The UI smoke asserts the served og:image matches
  # `ui/public/index.html`. No backend deploy can change that value, so wiring the
  # UI smoke here would pass on every backend build INCLUDING one that shipped a
  # completely broken API — a check whose result is independent of the fact it
  # reports. The backend needs its own discriminator, and `/wordsets` returning
  # real rows is it: rows come from MySQL, so an empty list separates "Flask is
  # up" from "the app works". `/` would not — it serves a static literal that a
  # backend which cannot reach the database still answers perfectly (issue-301).
  #
  # 🔴 NO `allowExitCodes` HERE, and that is a DELIBERATE DIVERGENCE from the
  # sibling `ui-smoke` step, which carries `allowExitCodes: [3]` per #240 AC6.
  # Three reasons, in order of weight (hc2's #302 review):
  #
  # 1. `allowExitCodes: [3]` makes CANNOT-TELL a build-level PASS. The #240
  #    rationale for accepting that is that the STEP still records FAILURE, so it
  #    is "seen but not identical" — loud without being a false claim about the
  #    code. That property is what the whole design rests on, and it is
  #    UNVERIFIED: across the 39 most recent lexitrail builds there is not one in
  #    which ui-smoke exited 3 with the allowance in place. The only non-SUCCESS
  #    ui-smoke on record (build 9c8be1ff) predates the allowance entirely
  #    (`allowExitCodes` absent, step FAILURE, build FAILURE). So nobody has
  #    observed the behaviour the exemption depends on.
  # 2. This repo has NO notify path. Nothing pages, nothing sweeps build history.
  #    So on exit 3 the sole trace is a step status whose rendering is the
  #    unverified thing in (1) — i.e. plausibly no trace at all.
  # 3. The backend's CANNOT-TELL causes are ALARMING, not benign: the host did
  #    not answer, or an unknown route started returning JSON. Immediately after
  #    a step that just verified the rollout, "the API is unreachable" is not an
  #    instrument hiccup to wave through.
  #
  # ⚠️ THE COST IS REAL AND IS NOT DENIED: this collapses FAIL (1) and
  # CANNOT-TELL (3) into one red, which is exactly what #235 AC3 warned trains
  # people to ignore the alarm. The mitigation is only partial — the message
  # below names which one fired — and a log line is weaker than a distinct
  # status. This is a trade with no free option, taken because a red someone
  # must look at is visible by construction while a green build is not.
  #
  # ⇒ REVERSAL CONDITION, so this is falsifiable rather than a preference: if
  # backend CANNOT-TELL fires more than once WITHOUT being a real problem, add
  # `allowExitCodes: [3]` and a notify path TOGETHER — never the allowance
  # alone, which is the silent-forever shape.
  #
  # ⚠️ And do NOT add 1 to allowExitCodes. A backend that deployed but serves no
  # data MUST redden the build; that is the entire point of the step.
  #
  # The retry exists so ordinary rollout propagation is not reported as a finding;
  # three attempts is the bound, and exhausting it IS the finding.
  - name: 'python:3.11-slim'
    id: 'backend-smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        for i in 1 2 3; do
          python3 scripts/smoke_backend_content.py && exit 0
          rc=$$?
          echo "smoke attempt $$i -> exit $$rc" >&2
          [ "$$i" = 3 ] && break
          sleep 20
        done
        echo "SMOKE-FAIL (exit $$rc): 1=wrong/empty content (a real finding about the deploy), 3=CANNOT-TELL (the control did not discriminate, or the host did not answer -- a finding about the INSTRUMENT, not the code). Both redden the build; read which." >&2
        exit "$$rc"
    waitFor: ['backend-deploy']

# 20m: the backend image is a small python:3.9-slim + pip install. The default
# is 10m and an uncached first build (no cache to pull) is the slow case.
timeout: '1200s'

# ─── logging destination ────────────────────────────────────────────────────
# REQUIRED, not stylistic: this build runs under a non-default service account
# (`lexitrail-sa@lexitrail`, which the trigger must specify — a trigger cannot be
# created without one), and Cloud Build REJECTS a service-account build that does
# not name a logging destination:
#
#   invalid argument: if 'build.service_account' is specified, the build must
#   either (a) specify 'build.logs_bucket', (b) use the REGIONAL_USER_OWNED_BUCKET
#   build.options.default_logs_bucket_behavior option, or (c) use either
#   CLOUD_LOGGING_ONLY / NONE logging options
#
# 🔴 That rejection happens at VALIDATION, before step 0. So it does not merely
# fail the build — it means `quota-gate` never runs, and a rejected build is
# therefore invisible to the budget: the first one (2026-08-28T16:00:31Z, issue-228)
# left `used` at 1. Do not read "the counter didn't move" as "no build was
# attempted"; on this path those are the same observation.
#
# CLOUD_LOGGING_ONLY over REGIONAL_USER_OWNED_BUCKET because it needs no bucket to
# create, pay for, or lifecycle, and `lexitrail-sa` holds `logging.logWriter`.
# NONE is not an option worth the saving here: the whole reason this trigger exists
# is that merged backend work was shipping unobserved, and a build whose output
# nobody can read reproduces that at the CI layer.
options:
  logging: CLOUD_LOGGING_ONLY
