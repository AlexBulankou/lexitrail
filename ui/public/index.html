<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-910V8PX54C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-910V8PX54C');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Lexitrail - Smart Chinese Vocabulary Learning">
  <meta name="description" content="Master Chinese vocabulary with AI-powered learning tools, interactive flashcards, and personalized study paths. Perfect for beginners to advanced learners." />
  <meta name="keywords" content="Chinese learning, vocabulary app, Mandarin Chinese, language learning, flashcards, HSK, Chinese characters, pinyin">
  <meta name="author" content="Alex Bulankou">

  <!-- lexitrail#368: ABSOLUTE, not %PUBLIC_URL%-relative. CRA substitutes
       %PUBLIC_URL% with the empty string in a production build, so these emitted
       `/images/og/...` — a root-relative path. Facebook, Pinterest and Twitter
       scrapers require an absolute URL and treat a relative one as absent, so the
       SPA shell failed Rich-Pin/unfurl checks even though the image exists and
       returns 200. The static templates already do this correctly
       (`ui/src/utils/{word,hsk,gloss}Pages.js` all emit `${ORIGIN}/images/og/...`);
       this file was the odd one out. Pinned by ui/src/utils/ogAbsolute.test.js.
       NOTE: %PUBLIC_URL% is still correct for favicon/manifest below — a browser
       resolves those against the document, and only SCRAPERS need absolute. -->
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lexitrail.com/">
  <meta property="og:title" content="Lexitrail - Smart Chinese Vocabulary Learning">
  <meta property="og:description" content="Master Chinese vocabulary with AI-powered learning tools, interactive flashcards, and personalized study paths.">
  <meta property="og:image" content="https://lexitrail.com/images/og/generated/og-landscape.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://lexitrail.com/">
  <meta property="twitter:title" content="Lexitrail - Smart Chinese Vocabulary Learning">
  <meta property="twitter:description" content="Master Chinese vocabulary with AI-powered learning tools, interactive flashcards, and personalized study paths.">
  <meta property="twitter:image" content="https://lexitrail.com/images/og/generated/og-landscape.png">

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <!-- lexitrail#186: NO canonical here, deliberately.
       This file is the SPA shell and `serve -s build` returns it for EVERY unmatched URL,
       so a canonical in it is served on /wordsets, /about, /game/2/PRACTICE, /privacy and
       /nonexistent-route-xyz alike -- an explicit "fold this into the homepage"
       instruction on every page of the site. Measured 2026-08-27: all of those returned
       HTTP 200 with canonical=/.
       No canonical is strictly better than a wrong one on every URL: Google then picks a
       canonical itself, which is a guess rather than an instruction to discard the page.
       The client-side <SEO> Helmet canonical does not reach crawlers (#76).
       Pages that CAN carry a correct self-canonical do: hsk1..6.html (#183) are real
       files, so they are served instead of this shell and carry their own. -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <base href="%PUBLIC_URL%/" />
  <title>Lexitrail - Smart Chinese Vocabulary Learning</title>
  <!-- Load config.js before the React bundle -->
  <script src="%PUBLIC_URL%/config.js"></script>

  <!-- Add structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Lexitrail",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0"
      },
      "screenshot": {
        "@type": "ImageObject",
        "url": "https://lexitrail.com/images/og/generated/og-landscape.png"
      }
    }
  </script>

  <!-- Add image-specific meta tags -->
  <meta name="thumbnail" content="https://lexitrail.com/images/thumbnails/app-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <!-- lexitrail#266: the PRE-MOUNT indicator. Alex's ruling (09-02, relayed by zz1)
         set the bar at 5s time-to-first-card AND asked for a visual indicator while
         loading. Measured on prod (HSK6, median cold arrival, 2278 ms total), the first
         ~446 ms is network + bundle download/execute -- React does not exist yet, so no
         component can render anything and the user sees a blank white page. This markup
         is the only thing that can cover that window.

         It is deliberately self-contained: the styles are INLINE because the CSS bundle
         has not loaded either, and it draws a CSS-only spinner rather than an <img> so it
         costs no extra request during the exact window it exists to cover.

         React removes it automatically: `src/index.js` uses `createRoot(...).render(...)`,
         and createRoot replaces the container's existing children on first render. That is
         load-bearing rather than incidental, so it is pinned by
         `src/utils/premountIndicator.test.js` -- switching to hydrateRoot would try to
         hydrate this markup instead of replacing it. -->
    <div id="lx-premount" role="status" aria-live="polite" aria-label="Loading Lexitrail">
      <style>
        #lx-premount {
          display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 16px;
          min-height: 60vh; font-family: system-ui, -apple-system, sans-serif;
          color: #555;
        }
        #lx-premount .lx-premount-spinner {
          width: 40px; height: 40px; border-radius: 50%;
          border: 4px solid rgba(0, 0, 0, 0.12);
          border-top-color: #555;
          animation: lx-premount-spin 0.9s linear infinite;
        }
        @keyframes lx-premount-spin { to { transform: rotate(360deg); } }
        /* Honour a reduced-motion preference: keep the indicator, drop the spin. */
        @media (prefers-reduced-motion: reduce) {
          #lx-premount .lx-premount-spinner { animation: none; }
        }
      </style>
      <div class="lx-premount-spinner"></div>
      <div>Loading Lexitrail&hellip;</div>
    </div>
    <!-- lexitrail#365 / #367: STATIC link block to the "<gloss> in Chinese" landers.
         `Home.js` already renders an equivalent "Popular words" list, but that markup
         is produced by React AFTER the bundle executes -- and robots.txt blocks
         /static/js/ + /*.js$ (issue-367, decided (b) static-only indexing), so
         Googlebot never runs the bundle and never sees those anchors. This file is
         the SPA shell served for every unmatched route, so it is the only place a
         crawler can find a real <a href> to the gloss pages within one hop of "/".

         Same mechanism as #lx-premount above (sibling child of #root, removed by
         createRoot on first mount -- see the comment there), so this costs real
         users nothing and is not cloaking: identical hrefs, identical destinations,
         just reachable before JS runs instead of after.

         Deliberately a PLAIN <a href="/<slug>.html">, not <Link>: the destination is
         a static .html file generated by ui/scripts/generate-gloss-pages.js and
         served outside the SPA's router, so a client-side route match would 404
         against App.js. Kept in sync with Home.js's PHASE1_QUERIES list by
         src/utils/staticGlossLinks.test.js -- a Phase-2 widening of PHASE1_QUERIES
         must touch this block too, or the two link lists silently diverge. -->
    <nav id="lx-static-links" aria-label="Popular words">
      <a href="/clarify-in-chinese.html">Clarify in Chinese</a>
      <a href="/tennis-in-chinese.html">Tennis in Chinese</a>
      <a href="/vague-in-chinese.html">Vague in Chinese</a>
      <a href="/reputation-in-chinese.html">Reputation in Chinese</a>
      <a href="/decision-in-chinese.html">Decision in Chinese</a>
    </nav>
    <!-- zz3 /lighthouse e6 (2026-09-11): the six HSK level lists were reachable from
         NOWHERE a JS-blocked crawler can see. Measured at the wire: the live homepage's
         entire href set was /, the 5 gloss landers, favicon, manifest and one CSS file.
         hsk4.html has never been crawled at all ("Discovered - currently not indexed",
         lastCrawlTime never), and hsk1/hsk3 sit at position 65.5 / 52.0.

         These are the property's BEST-MATCHED assets for its largest measured demand
         cluster -- ~20,000/mo aggregate at LOW competition ('hsk 1 vocabulary' 5,400/mo,
         'hsk 3 vocabulary' 3,600/mo, 'hsk 1 vocabulary pdf' 2,400/mo) -- and their pages
         are already good (correct title, meta, h1, 3,662 visible chars). They were
         starved of internal links, not of quality.

         A SEPARATE <nav> on purpose, not extra <a>s inside #lx-static-links: that block
         is documented and test-pinned (staticGlossLinks.test.js) as a hand-copied mirror
         of PHASE1_QUERIES, and widening it would blur the contract that tripwire exists
         to protect. Same plain-<a>-to-static-.html rule applies here -- these are files
         generated outside the SPA router, so <Link> would 404 against App.js. Sibling of
         #lx-premount inside #root, so createRoot() strips it on mount: invisible to
         users, visible to Googlebot. -->
    <nav id="lx-static-hsk" aria-label="HSK vocabulary lists">
      <a href="/hsk1.html">HSK 1 vocabulary list</a>
      <a href="/hsk2.html">HSK 2 vocabulary list</a>
      <a href="/hsk3.html">HSK 3 vocabulary list</a>
      <a href="/hsk4.html">HSK 4 vocabulary list</a>
      <a href="/hsk5.html">HSK 5 vocabulary list</a>
      <a href="/hsk6.html">HSK 6 vocabulary list</a>
    </nav>
  </div>
  <!--
      The root div is where our React app will be mounted.
    -->

</body>

</html>
