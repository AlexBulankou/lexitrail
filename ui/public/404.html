<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- lexitrail#204. serve-handler serves THIS file with an HTTP 404 when no route matches, which
     is the whole point: before this, every unknown path returned 200 and the SPA rendered its
     <NotFound /> — an indexable soft-404 on every typo'd or stale inbound link.
     Deliberately standalone: no bundle, no config.js, no fonts. A 404 that depends on the app
     booting is a 404 that can fail, and this page's one job is to be reliable. -->
<meta name="robots" content="noindex">
<title>Page not found — LexiTrail</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #fff; color: #222; }
  main { text-align: center; padding: 24px; max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: #555; line-height: 1.5; }
  a { display: inline-block; margin-top: 1rem; padding: 12px 20px; min-height: 44px;
      box-sizing: border-box; background: #1a73e8; color: #fff; border-radius: 8px;
      text-decoration: none; }
</style>
<!-- Google tag (gtag.js). Async and external on purpose: this page's standalone rule
     (see above) is about not depending on the APP booting. An async third-party tag cannot
     block the render, and without it #408's blind spot stays - a 404 is the one page whose
     traffic tells us which inbound links are broken. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-910V8PX54C"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-910V8PX54C');
</script>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>That page doesn’t exist. It may have moved, or the link may be out of date.</p>
  <a href="/">Back to LexiTrail</a>
  <footer class="site-footer" style="margin-top:24px;font-size:.9rem"><a href="mailto:support@lexitrail.com">Support: support@lexitrail.com</a></footer>
</main>
</body>
</html>
