# cloudbuild-ui.yaml — build and push the UI image on main merges (issue-216).
#
# WHY THIS EXISTS: `cloudbuild.yaml` (issue-77) closed the BACKEND half of the
# deploy gap. The UI half was left open and is the larger one. Measured
# 2026-08-28: the live UI image is `sha256:f691890…`, created 2026-08-11T18:47Z,
# and 32 commits touching `ui/` have merged since — 23 distinct issues. Four
# were verified inert at the wire, not inferred from the merge list:
#
#   #204  GET /does-not-exist -> 200        the indexable soft-404 is still served
#         (and #204 is CLOSED as COMPLETED, which is the harm: it reads as fixed)
#   #186  that same 200 still carries <link rel="canonical" href="https://lexitrail.com/"/>
#   #157  live sitemap.xml: 26 `xhtml:link`, 0 of them with an href
#   #183  /hsk2.html -> 301 -> /hsk2 -> the generic SPA shell, 2871 bytes
#
# So this file is not an improvement to a working pipeline; it is the pipeline.
#
# ─── WHAT THIS DOES (issue-216: it now ROLLS) ─────────────────────────────────
# It builds, pushes, ROLLS the deployment, reads the digest back, and smokes the
# served site. Until 2026-08-29 it stopped after the push, and this block said so
# in the imperative — a correct description of a pipeline that shipped nothing.
# zz1 relaying Alex, 2026-08-28: "the deploy becomes boring: every future merge
# rolls automatically... the seventeen-days-stale situation must be structurally
# impossible after this week."
#
# `lexitrail-ui-deployment` is pinned BY DIGEST, so `imagePullPolicy: Always` is
# inert (nothing newer for the same digest to resolve to) and `rollout restart`
# re-pulls identical bytes. The ONLY rollout that works is `set image` to the new
# digest — which is what `ui-deploy` does, followed by a read-back.
#
# ⚠️ `rollout status` reports that pods rolled and has no opinion on whether the
# IMAGE changed, so it returns success for a no-op restart. That is why the
# read-back compares the live spec against the digest we just pushed and FAILS on
# mismatch, rather than trusting a rollout to have meant something. The same stale
# `:latest` + `Always` claim in `cloudbuild.yaml` nearly made the issue-182
# security deploy a silent no-op; corrected there in the same cycle as this file.
#
# 🔴 This step is only possible because `lexitrail-sa` was granted
# `roles/container.developer` on `yojowa-claw` (issue-216, 2026-08-29). Without it
# `set image` returns PERMISSION_DENIED and the build goes red at the last step —
# loudly, which is the correct direction. Do not "fix" such a failure by deleting
# the deploy step; that restores the build-and-ship-nothing shape.
#
# ─── COST, WHICH IS THE REAL CONSTRAINT HERE ──────────────────────────────────
# lexitrail is `daily_build_count: 5`, `count_pinned: true`, enforcing. Merges
# touching `ui/` ran 3 / 5 / 12 on the last three active days, so on a busy day
# this trigger alone can exceed the pool and be REFUSED.
#
# 🔴 That is tolerable HERE and would not be for a test trigger, and the reason
# is worth stating so nobody "fixes" it by widening the budget reflexively: a
# refused DEPLOY build loses nothing, because the next successful build ships
# every commit merged since — the diffs are cumulative. A refused TEST build
# loses the coverage of one specific diff forever. Same refusal, different cost.
# (issue-219 is the decision about NOT moving the jest suite into this pool.)
#
# What a refusal does cost is a red check on `main` carrying zero information
# about the code. If that becomes routine, the fix is a deliberate raise of
# `daily_build_count` — measured at ~$0.0061/build, going 5 -> 12 costs about
# $0.04/day — and it must be a decision, not a drift: `count_pinned: true`
# exists so calibration cannot silently move a number a human chose.
#
# ─── REQUIRED WIRING, ALL THREE LOAD-BEARING ──────────────────────────────────
# (a) `--trigger-name=$TRIGGER_NAME`. A build step gets no ambient environment,
#     so without the flag the name reads EMPTY, empty is treated as ungated, and
#     the per-trigger downgrade turns enforcement off while leaving counting on.
#     Silently. Measured on this project: the 2026-08-28 12:16Z manual
#     `builds submit` shows `used: 1` — counted, unenforceable.
# (b) The `env:` block. The refusal message tells a blocked engineer to re-run
#     with `_BREAK_GLASS=1`; without this wiring that variable never reaches the
#     process and the hatch the message names does not exist.
# (c) Every later step says `waitFor: ['quota-gate']`. `waitFor: ['-']` means
#     START AT t=0 REGARDLESS OF POSITION, so a gate at the top of a file whose
#     steps all say `['-']` gates ZERO of them. Not "delete the dashes" — a step
#     with no `waitFor` waits for the one above it, serialising everything.
# (d) NOT in this file: the trigger's name must be added to `gate_triggers` for
#     `lexitrail` in `config/build-budget.json`. An empty or non-matching list
#     means nothing can ever be refused. Done in this same PR.

substitutions:
  # Default empty so ordinary builds are unaffected; only a deliberate re-run
  # with --substitutions=_BREAK_GLASS=1 overrides the quota gate. The override
  # is still COUNTED — an override nobody counts becomes the habit.
  _BREAK_GLASS: ''
  _IMAGE: 'us-central1-docker.pkg.dev/lexitrail/lexitrail-repo/lexitrail-ui'

steps:

  - name: 'python:3.11-slim'
    id: 'quota-gate'
    entrypoint: 'python3'
    args:
      - 'scripts/build_budget/inbuild.py'
      - '--repo=lexitrail'
      - '--state-uri=gs://lexitrail-build-budget/count-lexitrail.json'
      - '--build-id=$BUILD_ID'
      - '--trigger-name=$TRIGGER_NAME'
    env:
      - 'ENSEMBLE_BUILD_QUOTA_BREAK_GLASS=${_BREAK_GLASS}'
    waitFor: ['-']

  # `|| true` because a missing cache must never be a build failure — an
  # uncached rebuild is the most expensive thing this file can do, which is why
  # the pull is worth its own step.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args: ['-c', 'docker pull ${_IMAGE}:latest || true']
    waitFor: ['quota-gate']

  # No `machineType` anywhere in this file, deliberately: the default is the
  # cheap one, and specifying a larger one is a silent cost increase no reviewer
  # of a later PR would think to look for.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'ui-build'
    args:
      - 'build'
      - '--cache-from'
      - '${_IMAGE}:latest'
      - '-t'
      - '${_IMAGE}:latest'
      - '-t'
      - '${_IMAGE}:$SHORT_SHA'
      - './ui'
    waitFor: ['pull-cache']

  # 🔴 PUSHED HERE, IN A STEP, NOT VIA `images:`. Cloud Build's `images:` block
  # pushes AFTER every step completes, so a deploy step could never see the digest
  # it needs — `images:` and "roll it in this build" are mutually exclusive. The
  # block is deleted rather than kept alongside: keeping it would re-push identical
  # bytes and, worse, leave two places that decide what ships.
  #
  # The digest is taken from the PUSH OUTPUT, not from `docker inspect`
  # `.RepoDigests` — that field is a LIST and carries one entry per tag, so
  # `index 0` silently picks whichever the daemon ordered first. The push line is
  # unambiguous about which bytes went where.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'ui-push'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        docker push '${_IMAGE}:latest'
        docker push '${_IMAGE}:$SHORT_SHA' | tee /workspace/push.log
        DIGEST="$$(grep -oE 'sha256:[a-f0-9]{64}' /workspace/push.log | tail -1)"
        # CANNOT-TELL must not proceed as success: an empty digest here would make
        # `set image` a no-op arg and the read-back compare '' against '', passing.
        [ -n "$$DIGEST" ] || { echo "PUSH-FAIL: no digest in push output -- refusing to deploy an unknown image" >&2; exit 1; }
        printf '%s@%s' '${_IMAGE}' "$$DIGEST" > /workspace/ui_image_ref.txt
        echo "pushed: $$(cat /workspace/ui_image_ref.txt)"
    waitFor: ['ui-build']

  # `set image` to the digest, then READ THE LIVE SPEC BACK and compare. Not
  # `rollout status`, which reports that pods rolled and has no opinion on whether
  # the image changed -- it returns success for a no-op restart, which is exactly
  # the failure this whole file exists to end.
  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'ui-deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud container clusters get-credentials ys-autopilot \
          --region us-central1 --project yojowa-claw
        REF="$$(cat /workspace/ui_image_ref.txt)"
        kubectl -n lexitrail set image deployment/lexitrail-ui-deployment \
          lexitrail-ui="$$REF"
        kubectl -n lexitrail rollout status deployment/lexitrail-ui-deployment --timeout=300s
        LIVE="$$(kubectl -n lexitrail get deploy lexitrail-ui-deployment \
          -o jsonpath='{.spec.template.spec.containers[0].image}')"
        echo "requested: $$REF"
        echo "live spec: $$LIVE"
        [ "$$LIVE" = "$$REF" ] || { echo "DEPLOY-FAIL: live spec does not match what we pushed" >&2; exit 1; }
    waitFor: ['ui-push']

  # zz1 relaying Alex 2026-08-28: "wire its CANNOT-TELL and FAIL outcomes to a
  # surface that is guaranteed to be seen."
  #
  # 🔴 SEEN IS NOT THE SAME AS IDENTICAL, and issue-240 AC6 is the correction of my
  # own first version. That version failed the build on ANY non-zero exit, which
  # collapsed FAIL (exit 1) and CANNOT-TELL (exit 3) into one red -- and issue-235
  # AC3, written at #234's review BEFORE this step existed, said exactly why not:
  # "wiring it as a failure would train people to ignore it. It should page
  # differently from exit 1." Its prediction came true on the first real fire.
  #
  # `allowExitCodes: [3]` is the mechanism that gives both: the step still RUNS and
  # its status is still recorded as FAILURE on exit 3 -- visible in the console and
  # in `builds describe` -- but the BUILD stays green. So:
  #
  #     exit 0  step SUCCESS, build green    served content matches source
  #     exit 1  step FAILURE, build RED      stale/wrong content -- a real finding
  #     exit 3  step FAILURE, build GREEN    CANNOT-TELL: the instrument, not the
  #                                          deploy. Loud, and not a false alarm
  #                                          about the code.
  #
  # ⚠️ Do NOT "simplify" this to a bare non-zero check. Exit 3 means the probe could
  # not discriminate; reporting that as a broken deploy is a claim about the code
  # that the run does not support, and a red that recurs on its own baseline gets
  # muted -- after which the step is absent on the day it matters.
  #
  # ⚠️ And do NOT add 1 to allowExitCodes. A stale deploy MUST redden the build;
  # that is the entire point of the step.
  #
  # The retry exists so ordinary propagation lag is not reported as a finding;
  # three attempts is the bound, and exhausting it IS the finding.
  - name: 'python:3.11-slim'
    id: 'ui-smoke'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -uo pipefail
        for i in 1 2 3; do
          python3 scripts/smoke_served_content.py && exit 0
          rc=$?
          echo "smoke attempt $$i -> exit $$rc" >&2
          [ "$$i" = 3 ] && break
          sleep 20
        done
        echo "SMOKE-FAIL (exit $$rc): 1=stale/wrong content, 3=CANNOT-TELL (the control did not discriminate, or the network did not answer). Neither is a pass." >&2
        exit "$$rc"
    # issue-240 AC6: 3 only. See the note above -- exit 1 must still fail the build.
    allowExitCodes: [3]
    waitFor: ['ui-deploy']

# 30m, longer than the backend's 20m: this image runs `npm install` plus a CRA
# production build on node:16-alpine, and the uncached first build (nothing to
# pull) is the slow case.
timeout: '1800s'

# ─── logging destination ────────────────────────────────────────────────────
# REQUIRED, not stylistic: this build runs under a non-default service account
# (`lexitrail-sa@lexitrail`, which the trigger must specify — a trigger cannot be
# created without one), and Cloud Build REJECTS a service-account build that does
# not name a logging destination:
#
#   invalid argument: if 'build.service_account' is specified, the build must
#   either (a) specify 'build.logs_bucket', (b) use the REGIONAL_USER_OWNED_BUCKET
#   build.options.default_logs_bucket_behavior option, or (c) use either
#   CLOUD_LOGGING_ONLY / NONE logging options
#
# 🔴 That rejection happens at VALIDATION, before step 0. So it does not merely
# fail the build — it means `quota-gate` never runs, and a rejected build is
# therefore invisible to the budget: the first one (2026-08-28T16:00:31Z, issue-228)
# left `used` at 1. Do not read "the counter didn't move" as "no build was
# attempted"; on this path those are the same observation.
#
# CLOUD_LOGGING_ONLY over REGIONAL_USER_OWNED_BUCKET because it needs no bucket to
# create, pay for, or lifecycle, and `lexitrail-sa` holds `logging.logWriter`.
# NONE is not an option worth the saving here: the whole reason this trigger exists
# is that merged backend work was shipping unobserved, and a build whose output
# nobody can read reproduces that at the CI layer.
# NOTE: no trigger uses this file YET — issue-216 creates `lexitrail-ui-deploy-main`,
# which will specify a service account for the same reason the backend trigger did.
# The option is here now so that trigger's first build is not rejected the way the
# backend's first build was (issue-228). Fixing only the file that already failed
# would leave an identical rejection waiting behind the next trigger creation.
options:
  logging: CLOUD_LOGGING_ONLY
